name: Weekly link check

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit links
        run: python3 audit_links.py --external --write || true
      - name: Commit the report
        run: |
          git config user.name "404 Memory Found build"
          git config user.email "hello@404memoryfound.com"
          git add docs/link-report.md
          git diff --cached --quiet && exit 0
          git commit -m "Weekly link report"
          git pull --rebase origin main && git push origin main
