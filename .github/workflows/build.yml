name: Build and Deploy Site

concurrency:
  group: publish
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - 'posts.json'
      - 'redirects.json'
      - 'images-manifest.json'
      - 'authors.json'
      - 'site-config.json'
      - 'build.py'
      - 'src/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pillow

      - name: Build, commit and push (regenerates from the latest main on every attempt, so a push race never conflicts)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python fetch_images.py
            python make_og_cards.py
            python build.py
            git add -A
            if git diff --staged --quiet; then echo "Nothing to commit"; exit 0; fi
            git commit -m "Auto-build: update generated HTML, feeds and sitemap"
            if git push origin main; then exit 0; fi
            echo "push rejected (attempt $attempt), retrying from the latest main"
            sleep 15
          done
          echo "could not push after 4 attempts"; exit 1

      - name: Notify search engines (IndexNow)
        run: python indexnow_ping.py

      - name: Pin new posts to Pinterest (skips until the secrets exist)
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: |
          python pinterest_publish.py --backfill 2
          git add pinterest-state.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Pinterest: record pinned posts" && git pull --rebase origin main && git push origin main)
